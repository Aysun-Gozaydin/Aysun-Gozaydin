<svg
    width="1180"
    height="610"
    viewBox="0 0 1180 610"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Background -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1180" y2="610">
        <stop offset="0%" stop-color="#030712">
            <animate
                attributeName="stop-color"
                values="#030712;#0F172A;#030712"
                dur="12s"
                repeatCount="indefinite"/>
        </stop>

        <stop offset="100%" stop-color="#111827">
            <animate
                attributeName="stop-color"
                values="#111827;#0B1120;#111827"
                dur="12s"
                repeatCount="indefinite"/>
        </stop>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%" stop-color="#7C3AED">
            <animate
                attributeName="stop-color"
                values="#7C3AED;#22D3EE;#10B981;#7C3AED"
                dur="8s"
                repeatCount="indefinite"/>
        </stop>

        <stop offset="100%" stop-color="#22D3EE">
            <animate
                attributeName="stop-color"
                values="#22D3EE;#10B981;#7C3AED;#22D3EE"
                dur="8s"
                repeatCount="indefinite"/>
        </stop>

    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Glass Blur -->
    <filter id="glassBlur"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
        <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Purple Glow -->
    <radialGradient id="purpleGlow">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow">
        <stop offset="0%" stop-color="#22D3EE" stop-opacity=".40"/>
        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow">
        <stop offset="0%" stop-color="#10B981" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

</defs>

<!-- Background -->

<rect
    width="1180"
    height="610"
    rx="28"
    fill="url(#bgGradient)" />

<!-- Border -->

<rect
    x="2"
    y="2"
    width="1176"
    height="606"
    rx="26"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-opacity=".25"/>

<!-- Animated Background Lights -->

<circle
    cx="180"
    cy="120"
    r="180"
    fill="url(#purpleGlow)"
    filter="url(#glassBlur)">

    <animate
        attributeName="cx"
        values="180;250;180"
        dur="14s"
        repeatCount="indefinite"/>

    <animate
        attributeName="cy"
        values="120;180;120"
        dur="16s"
        repeatCount="indefinite"/>

</circle>

<circle
    cx="980"
    cy="460"
    r="220"
    fill="url(#cyanGlow)"
    filter="url(#glassBlur)">

    <animate
        attributeName="cx"
        values="980;900;980"
        dur="18s"
        repeatCount="indefinite"/>

    <animate
        attributeName="cy"
        values="460;400;460"
        dur="15s"
        repeatCount="indefinite"/>

</circle>

<circle
    cx="600"
    cy="300"
    r="150"
    fill="url(#emeraldGlow)"
    filter="url(#glassBlur)">

    <animate
        attributeName="r"
        values="140;180;140"
        dur="12s"
        repeatCount="indefinite"/>

</circle>

<rect
    x="25"
    y="25"
    width="1130"
    height="560"
    rx="24"
    fill="#FFFFFF"
    fill-opacity="0.03"
    stroke="#FFFFFF"
    stroke-opacity="0.08"/>

<!-- Glass Panel -->
<!-- ========================= -->
<!-- LEFT PANEL -->
<!-- ========================= -->
<!-- AI ROBOT CORE -->

<g transform="translate(90 130)" filter="url(#glow)">

    <!-- Robot Head -->
    <rect
        x="70"
        y="40"
        width="170"
        height="130"
        rx="35"
        fill="#111827"
        stroke="url(#accent)"
        stroke-width="3"/>


    <!-- Antenna -->

    <line
        x1="155"
        y1="40"
        x2="155"
        y2="5"
        stroke="#22D3EE"
        stroke-width="3"/>

    <circle
        cx="155"
        cy="5"
        r="8"
        fill="#22D3EE">

        <animate
            attributeName="r"
            values="8;12;8"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>


    <!-- Eyes -->

    <circle
        cx="115"
        cy="95"
        r="12"
        fill="#22D3EE">

        <animate
            attributeName="opacity"
            values="1;.3;1"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="195"
        cy="95"
        r="12"
        fill="#7C3AED">

        <animate
            attributeName="opacity"
            values=".3;1;.3"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>


    <!-- Mouth -->

    <rect
        x="120"
        y="130"
        width="70"
        height="8"
        rx="4"
        fill="#10B981"/>



    <!-- Body -->

    <rect
        x="95"
        y="190"
        width="120"
        height="120"
        rx="30"
        fill="#0F172A"
        stroke="#22D3EE"
        stroke-opacity=".5"/>


    <!-- Circuit Lines -->

    <path
        d="M95 230 H55 V260 H95"
        stroke="#7C3AED"
        stroke-width="3"
        fill="none"/>


    <path
        d="M215 230 H255 V260 H215"
        stroke="#10B981"
        stroke-width="3"
        fill="none"/>


    <circle
        cx="155"
        cy="250"
        r="20"
        fill="url(#accent)">

        <animate
            attributeName="r"
            values="20;25;20"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>


</g>


